[workspace]
members = ["crates/backend", "crates/engine", "crates/input", "crates/loader", "crates/tui", "crates/wave"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[package]
name = "dj-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
engine = { path = "crates/engine" }
input = { path = "crates/input" }
tui = { path = "crates/tui" }
loader = { path = "crates/loader" }
wave = { path = "crates/wave", features = ["serde"] }
backend = { path = "crates/backend" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = "0.30"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

# Decoding and resampling are unbearably slow unoptimised; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
