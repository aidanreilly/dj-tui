name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  jack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y jackd2 libjack-jackd2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: JACK integration tests against the dummy driver
        run: |
          jackd -n ci -d dummy -r 48000 -p 256 -P 4 -C 0 &
          sleep 2
          JACK_DEFAULT_SERVER=ci DJ_TUI_JACK_TESTS=1 cargo test -p backend --locked --test jack_dummy

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # jack-sys builds against jack.pc, so this job needs the same packages as `test`.
      # Without them its build script panics and the job never reaches the compiler.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev
      - uses: dtolnay/rust-toolchain@1.90
      - run: cargo test --workspace --locked

  # Detector accuracy against the GiantSteps sets (spec 6). The datasets are far too big to
  # check in, so this runs only where the repository variable points at a copy of them.
  accuracy:
    runs-on: ubuntu-24.04
    if: vars.GIANTSTEPS_DIR != ''
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release --locked --example giantsteps -- "${{ vars.GIANTSTEPS_DIR }}"

  licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
